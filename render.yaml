# Nobu RSVP + Dashboard — Deploy to Render.com
#
# 1. Push this repo to GitHub
# 2. Render auto-detects this config
# 3. After deploy, the dashboard is at https://nobu-rsvp.onrender.com/dashboard

services:
  - type: web
    name: nobu-rsvp
    env: python
    buildCommand: "pip install flask"
    startCommand: "python3 nobu_dashboard_server.py"
    plan: free
    envVars:
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: REFRESH_MINUTES
        value: "30"
